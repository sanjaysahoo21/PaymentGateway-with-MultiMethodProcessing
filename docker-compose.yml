# Docker Compose configuration for Payment Gateway
# Orchestrates: PostgreSQL database, Spring Boot API, React dashboard, React checkout
# All services communicate via internal network; only specified ports exposed
version: '3.8'

services:
  # PostgreSQL 15 database service
  postgres:
    image: postgres:15-alpine
    container_name: pg_gateway
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass
    ports:
      - "5432:5432"  # Expose PostgreSQL port for local development
    # Health check ensures database is ready before API startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d payment_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Payment Gateway API
  api:
    build:
      context: ./backend
    container_name: gateway_api
    ports:
      - "8000:8000"  # Gateway API endpoint
    environment:
      # PostgreSQL connection details
      DATABASE_URL: postgresql://gateway_user:gateway_pass@postgres:5432/payment_gateway
      PORT: 8000
    # Wait for PostgreSQL health check before starting
    depends_on:
      postgres:
        condition: service_healthy

  # React Merchant Dashboard
  dashboard:
    build:
      context: ./frontend
    container_name: gateway_dashboard
    ports:
      - "3000:80"  # Dashboard web server
    # Dashboard depends on API for authentication and payment data
    depends_on:
      - api

  # React Hosted Checkout Page
  checkout:
    build:
      context: ./checkout-page
    container_name: gateway_checkout
    ports:
      - "3001:80"  # Checkout web server
    # Checkout depends on API for order creation and payment processing
    depends_on:
      - api
