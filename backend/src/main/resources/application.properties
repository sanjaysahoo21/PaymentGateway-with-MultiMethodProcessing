server.port=${PORT:8000}

spring.datasource.url=jdbc:${DATABASE_URL:postgresql://gateway_user:gateway_pass@localhost:5432/payment_gateway}
spring.datasource.username=${DB_USER:gateway_user}
spring.datasource.password=${DB_PASSWORD:gateway_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# App-specific settings
app.test-merchant.email=${TEST_MERCHANT_EMAIL:test@example.com}
app.test-merchant.api-key=${TEST_API_KEY:key_test_abc123}
app.test-merchant.api-secret=${TEST_API_SECRET:secret_test_xyz789}

app.payment.upi-success-rate=${UPI_SUCCESS_RATE:0.90}
app.payment.card-success-rate=${CARD_SUCCESS_RATE:0.95}
app.payment.processing-delay-min=${PROCESSING_DELAY_MIN:5000}
app.payment.processing-delay-max=${PROCESSING_DELAY_MAX:10000}
app.payment.test-mode=${TEST_MODE:false}
app.payment.test-success=${TEST_PAYMENT_SUCCESS:true}
app.payment.test-processing-delay=${TEST_PROCESSING_DELAY:1000}

spring.jackson.serialization.write-dates-as-timestamps=false
