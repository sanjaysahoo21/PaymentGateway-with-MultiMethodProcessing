# ===================================
# Payment Gateway Configuration
# ===================================
# All settings support environment variable overrides for containerized deployments
# Format: Property names use ${PROPERTY_NAME:default_value}

# ===== Server Configuration =====
# API server port (default: 8000)
server.port=${PORT:8000}

# ===== Database Configuration =====
# PostgreSQL connection settings
# DATABASE_URL format: postgresql://user:password@host:port/database
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://gateway_user:gateway_pass@localhost:5432/payment_gateway}
spring.datasource.username=${DB_USER:gateway_user}
spring.datasource.password=${DB_PASSWORD:gateway_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA/Hibernate Configuration =====
# ddl-auto=none: Disables auto-schema generation (uses schema.sql instead)
spring.jpa.hibernate.ddl-auto=none
# Use PostgreSQL dialect for query optimization
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Disable SQL logging in production (improve performance)
spring.jpa.show-sql=false
# Initialize database schema from schema.sql on startup
spring.sql.init.mode=always
# Continue startup if schema.sql execution encounters errors (idempotency)
spring.sql.init.continue-on-error=true

# ===== Test Merchant Seeding =====
# Test merchant auto-populated on application startup
# Allows immediate testing without manual merchant registration
app.test-merchant.email=${TEST_MERCHANT_EMAIL:test@example.com}
app.test-merchant.api-key=${TEST_API_KEY:key_test_abc123}
app.test-merchant.api-secret=${TEST_API_SECRET:secret_test_xyz789}

# ===== Payment Processing Configuration =====
# Success rates for simulated payment processing
# UPI: 90% success rate (matches real-world statistics)
app.payment.upi-success-rate=${UPI_SUCCESS_RATE:0.90}
# Card: 95% success rate (slightly higher than UPI due to better fraud detection)
app.payment.card-success-rate=${CARD_SUCCESS_RATE:0.95}

# Processing delay simulation (milliseconds)
# Real payment gateways take 5-10 seconds for authorization
# Minimum delay in milliseconds (default: 5000ms = 5s)
app.payment.processing-delay-min=${PROCESSING_DELAY_MIN:5000}
# Maximum delay in milliseconds (default: 10000ms = 10s)
app.payment.processing-delay-max=${PROCESSING_DELAY_MAX:10000}

# Test mode configuration for faster testing
# Enable test mode to skip delays and control outcomes
app.payment.test-mode=${TEST_MODE:false}
# Test mode: force payment success (overrides success rate)
app.payment.test-success=${TEST_PAYMENT_SUCCESS:true}
# Test mode: reduced processing delay (default: 1000ms = 1s)
app.payment.test-processing-delay=${TEST_PROCESSING_DELAY:1000}

# ===== Jackson Configuration =====
# Serialize dates as ISO-8601 strings instead of timestamps (JSON standard)
spring.jackson.serialization.write-dates-as-timestamps=false
